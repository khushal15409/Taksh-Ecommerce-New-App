name: Build Signed Android AAB

# Manual only. Pick the branch in "Run workflow" (Use workflow from). Produces a Play Store
# upload bundle signed with the upload keystore from repository secrets.
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-android-aab-${{ github.ref }}
  cancel-in-progress: false

env:
  EXPECTED_APPLICATION_ID: in.takshallinone.app
  EXPECTED_SHA1: "2E:5D:CE:0E:E3:25:6E:DD:F1:C4:8C:0E:C0:8C:20:AE:17:74:6A:C8"
  BUNDLETOOL_VERSION: "1.18.1"

jobs:
  build-aab:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: "3.38.5"
          cache: true

      - name: Flutter version
        run: flutter --version

      # Fail early, before building, if the Firebase file is not for the final application id.
      - name: Check application id and Firebase config
        run: |
          grep -q 'applicationId = "'"$EXPECTED_APPLICATION_ID"'"' android/app/build.gradle.kts \
            || { echo "::error::applicationId in build.gradle.kts is not $EXPECTED_APPLICATION_ID"; exit 1; }
          grep -q '"package_name": *"'"$EXPECTED_APPLICATION_ID"'"' android/app/google-services.json \
            || { echo "::error::android/app/google-services.json has no client for $EXPECTED_APPLICATION_ID"; exit 1; }
          echo "applicationId and google-services.json OK"

      # Maps (Android SDK) and Places (HTTP) use two different Google keys, each restricted differently.
      - name: Check client API key secrets
        env:
          MAPS_KEY: ${{ secrets.GOOGLE_MAPS_ANDROID_API_KEY }}
          PLACES_KEY: ${{ secrets.GOOGLE_PLACES_API_KEY }}
        run: |
          missing=""
          [ -n "${MAPS_KEY:-}" ]   || missing="$missing GOOGLE_MAPS_ANDROID_API_KEY"
          [ -n "${PLACES_KEY:-}" ] || missing="$missing GOOGLE_PLACES_API_KEY"
          if [ -n "$missing" ]; then
            echo "::error::Missing repository secrets:$missing (a release build needs both client keys)"
            exit 1
          fi
          echo "Client API key secrets present"

      - name: Prepare upload keystore and key.properties
        env:
          KS_B64: ${{ secrets.ANDROID_UPLOAD_KEYSTORE_BASE64 }}
          KS_PASS: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_PASS: ${{ secrets.ANDROID_KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          set -euo pipefail
          missing=""
          [ -n "${KS_B64:-}" ]   || missing="$missing ANDROID_UPLOAD_KEYSTORE_BASE64"
          [ -n "${KS_PASS:-}" ]  || missing="$missing ANDROID_KEYSTORE_PASSWORD"
          [ -n "${KEY_PASS:-}" ] || missing="$missing ANDROID_KEY_PASSWORD"
          [ -n "${KEY_ALIAS:-}" ] || missing="$missing ANDROID_KEY_ALIAS"
          if [ -n "$missing" ]; then
            echo "::error::Missing repository secrets:$missing"
            exit 1
          fi

          umask 077
          KS_PATH="$RUNNER_TEMP/upload-keystore.jks"
          printf '%s' "$KS_B64" | base64 -d > "$KS_PATH" \
            || { echo "::error::ANDROID_UPLOAD_KEYSTORE_BASE64 is not valid base64"; exit 1; }

          # Valid keystore, right password, alias present (output not shown, only the verdict).
          if ! keytool -list -keystore "$KS_PATH" -storepass:env KS_PASS -alias "$KEY_ALIAS" >/dev/null 2>&1; then
            echo "::error::Keystore could not be opened or alias '$KEY_ALIAS' not found (check the keystore, password and alias secrets)"
            exit 1
          fi

          printf 'storePassword=%s\nkeyPassword=%s\nkeyAlias=%s\nstoreFile=%s\n' \
            "$KS_PASS" "$KEY_PASS" "$KEY_ALIAS" "$KS_PATH" > android/key.properties
          echo "Upload keystore verified; android/key.properties written (not shown)"

      - name: Install dependencies
        run: flutter pub get

      # .env is a gitignored Flutter asset; same handling as the APK workflow.
      - name: Create .env (client-side values only)
        env:
          PLACES_KEY: ${{ secrets.GOOGLE_PLACES_API_KEY }}
        run: |
          set -euo pipefail
          # Only this one client-side value is ever written into the bundled .env.
          printf 'GOOGLE_PLACES_API_KEY=%s\n' "$PLACES_KEY" > .env

      - name: Check release inputs (no tracked secrets, client-only .env)
        run: bash tool/check_release_inputs.sh .

      # *.g.dart / *.freezed.dart are gitignored, so they must be generated in CI.
      - name: Generate code (build_runner)
        run: dart run build_runner build --delete-conflicting-outputs

      - name: Build release AAB
        env:
          MAPS_API_KEY: ${{ secrets.GOOGLE_MAPS_ANDROID_API_KEY }}
        run: flutter build appbundle --release -t lib/main.dart

      - name: Verify AAB
        run: |
          set -euo pipefail
          AAB=build/app/outputs/bundle/release/app-release.aab
          [ -f "$AAB" ] || { echo "::error::$AAB was not produced"; exit 1; }
          echo "AAB size: $(du -h "$AAB" | cut -f1)"

          # Signature
          jarsigner -verify -verbose -certs "$AAB" > "$RUNNER_TEMP/jarsigner.txt" 2>&1 || true
          grep -q "jar verified" "$RUNNER_TEMP/jarsigner.txt" \
            || { echo "::error::jarsigner could not verify the AAB signature"; exit 1; }
          echo "jarsigner: jar verified"

          # Certificate SHA-1 must be the upload certificate (never the debug key)
          ACTUAL=$(keytool -printcert -jarfile "$AAB" | awk '/SHA1:/ && !found {print $2; found=1}')
          echo "Certificate SHA-1: $ACTUAL"
          echo "Expected SHA-1:    $EXPECTED_SHA1"
          [ "$ACTUAL" = "$EXPECTED_SHA1" ] \
            || { echo "::error::AAB is not signed with the expected upload certificate"; exit 1; }
          echo "SHA-1 matches the upload certificate"

          # Application id, read from the bundle itself
          curl -fsSL -o "$RUNNER_TEMP/bundletool.jar" \
            "https://github.com/google/bundletool/releases/download/${BUNDLETOOL_VERSION}/bundletool-all-${BUNDLETOOL_VERSION}.jar"
          APPID=$(java -jar "$RUNNER_TEMP/bundletool.jar" dump manifest --bundle "$AAB" --xpath /manifest/@package)
          echo "Application ID in bundle: $APPID"
          [ "$APPID" = "$EXPECTED_APPLICATION_ID" ] \
            || { echo "::error::Application id in the AAB is '$APPID', expected $EXPECTED_APPLICATION_ID"; exit 1; }
          echo "Application ID verified"

      # Every 64-bit native library must be ELF-aligned for 16 KB memory pages (Play requirement).
      - name: Check 16 KB page-size alignment
        run: bash tool/check_16kb_alignment.sh build/app/outputs/bundle/release/app-release.aab

      # Only the bundle is uploaded; never key.properties or the keystore.
      - name: Upload AAB artifact
        uses: actions/upload-artifact@v4
        with:
          name: taksh-app-release-aab
          path: build/app/outputs/bundle/release/app-release.aab
          retention-days: 14
          if-no-files-found: error

      # R8 mapping file (not a secret): needed to read crash stack traces / upload to Play Console.
      - name: Upload R8 mapping
        uses: actions/upload-artifact@v4
        with:
          name: taksh-release-mapping
          path: build/app/outputs/mapping/release/mapping.txt
          retention-days: 14
          if-no-files-found: warn

      - name: Summary
        run: |
          {
            echo "## Signed Android AAB built"
            echo ""
            echo "- Artifact: \`taksh-app-release-aab\` (retained 14 days)"
            echo "- Application ID: \`$EXPECTED_APPLICATION_ID\`"
            echo "- Signed with the upload key (SHA-1 verified)"
            echo "- Commit: \`${GITHUB_SHA::7}\`"
            echo ""
            echo "Download: this run -> *Artifacts* at the bottom of the page. Upload it to Play Console manually."
          } >> "$GITHUB_STEP_SUMMARY"

      # Always remove signing material from the runner, even when the build failed.
      - name: Clean up signing files
        if: always()
        run: |
          rm -f android/key.properties .env "$RUNNER_TEMP/upload-keystore.jks" "$RUNNER_TEMP/jarsigner.txt"

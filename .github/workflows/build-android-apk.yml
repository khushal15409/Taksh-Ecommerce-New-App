name: Build Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-android-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: "3.38.5"
          cache: true

      - name: Flutter version
        run: flutter --version

      # pubspec.lock is committed, so resolution is reproducible.
      - name: Install dependencies
        run: flutter pub get

      # .env is a gitignored Flutter asset; create it so the build doesn't fail.
      # Set the GOOGLE_PLACES_API_KEY repo secret to enable Places suggestions.
      - name: Create .env
        env:
          PLACES_KEY: ${{ secrets.GOOGLE_PLACES_API_KEY }}
        run: |
          set -euo pipefail
          KEY="${PLACES_KEY:-}"
          if [ -z "$KEY" ]; then
            # No secret set: use the Maps key the app already ships in AndroidManifest.xml
            # (same key, same behaviour as before .env.example was cleaned).
            KEY=$(grep -o 'AIza[0-9A-Za-z_-]\{30,\}' android/app/src/main/AndroidManifest.xml | sed -n '1p' || true)
          fi
          if [ -z "$KEY" ]; then
            echo "::warning::No Places API key available; address suggestions will be disabled"
          fi
          # Only this one client-side value is ever written into the bundled .env.
          printf 'GOOGLE_PLACES_API_KEY=%s\n' "$KEY" > .env

      # *.g.dart / *.freezed.dart are gitignored, so they must be generated in CI.
      - name: Generate code (build_runner)
        run: dart run build_runner build --delete-conflicting-outputs

      # Errors fail the job; pre-existing lint infos/warnings do not.
      - name: Analyze
        run: flutter analyze --no-fatal-infos --no-fatal-warnings

      # Production entry point (lib/main.dart). No flavors are defined in this project.
      - name: Build release APK
        env:
          # Test APK only: explicitly allowed to be debug-signed (App Bundles never are).
          TAKSH_ALLOW_DEBUG_SIGNED_APK: "true"
        run: flutter build apk --release -t lib/main.dart

      - name: Locate APK
        id: apk
        run: |
          APK=$(find build/app/outputs -name '*.apk' -path '*release*' | head -n 1)
          if [ -n "$APK" ]; then
            echo "path=$APK" >> "$GITHUB_OUTPUT"
            echo "found=true" >> "$GITHUB_OUTPUT"
            echo "Found APK: $APK ($(du -h "$APK" | cut -f1))"
          else
            echo "found=false" >> "$GITHUB_OUTPUT"
            echo "::error::No release APK found under build/app/outputs"
            exit 1
          fi

      - name: Upload APK artifact
        if: steps.apk.outputs.found == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: taksh-app-apk
          path: ${{ steps.apk.outputs.path }}
          retention-days: 14
          if-no-files-found: error

      - name: Summary
        if: steps.apk.outputs.found == 'true'
        run: |
          {
            echo "## Android APK built"
            echo ""
            echo "- Artifact name: \`taksh-app-apk\` (retained 14 days)"
            echo "- File: \`$(basename "${{ steps.apk.outputs.path }}")\`"
            echo "- Commit: \`${GITHUB_SHA::7}\`"
            echo ""
            echo "**Download:** Actions → this run → *Artifacts* section at the bottom of this page → \`taksh-app-apk\`."
            echo ""
            echo "> Release build signed with the **debug key** (no release keystore configured). Fine for testing, not for Play Store."
          } >> "$GITHUB_STEP_SUMMARY"

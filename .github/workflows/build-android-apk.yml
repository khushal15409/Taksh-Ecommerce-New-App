name: Build Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-android-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: "3.38.5"
          cache: true

      - name: Flutter version
        run: flutter --version

      # pubspec.lock is committed, so resolution is reproducible.
      - name: Install dependencies
        run: flutter pub get

      # .env is a gitignored Flutter asset; create it so the build doesn't fail.
      # Set the GOOGLE_PLACES_API_KEY repo secret to enable Places suggestions.
      - name: Create .env
        env:
          PLACES_KEY: ${{ secrets.GOOGLE_PLACES_API_KEY }}
        run: |
          set -euo pipefail
          if [ -z "${PLACES_KEY:-}" ]; then
            echo "::warning::GOOGLE_PLACES_API_KEY secret not set; address suggestions are disabled in this test APK"
          fi
          # Only this one client-side value is ever written into the bundled .env.
          printf 'GOOGLE_PLACES_API_KEY=%s\n' "${PLACES_KEY:-}" > .env

      # *.g.dart / *.freezed.dart are gitignored, so they must be generated in CI.
      - name: Generate code (build_runner)
        run: dart run build_runner build --delete-conflicting-outputs

      # Errors fail the job; pre-existing lint infos/warnings do not.
      - name: Analyze
        run: flutter analyze --no-fatal-infos --no-fatal-warnings

      # Production entry point (lib/main.dart). No flavors are defined in this project.
      - name: Build release APK
        env:
          # Test APK only: explicitly allowed to be debug-signed (App Bundles never are).
          TAKSH_ALLOW_DEBUG_SIGNED_APK: "true"
          # Android Maps SDK key (optional for this test APK; without it the map is blank).
          MAPS_API_KEY: ${{ secrets.GOOGLE_MAPS_ANDROID_API_KEY }}
        run: flutter build apk --release -t lib/main.dart

      # A blank Maps key builds fine but every map in the app then draws grey with only the Google logo.
      # Looks inside the finished APK (key value is never printed) and warns when it is empty.
      - name: Check the Maps key made it into the APK
        run: |
          APK=$(find build/app/outputs -name '*.apk' -path '*release*' | head -n 1)
          AAPT=$(ls "$ANDROID_HOME"/build-tools/*/aapt2 2>/dev/null | sort -V | tail -n 1)
          if [ -z "$APK" ] || [ -z "$AAPT" ]; then echo "::notice::could not inspect the APK manifest"; exit 0; fi
          VAL=$("$AAPT" dump xmltree --file AndroidManifest.xml "$APK" | grep -A2 'com.google.android.geo.API_KEY' | grep -o 'AIza[A-Za-z0-9_-]*' | head -n 1 || true)
          if [ -n "$VAL" ]; then echo "Maps key present in the APK (length ${#VAL})"; else echo "::warning::The APK has NO Maps key - maps will be grey. Set the GOOGLE_MAPS_ANDROID_API_KEY repository secret and build again."; fi

      - name: Locate APK
        id: apk
        run: |
          APK=$(find build/app/outputs -name '*.apk' -path '*release*' | head -n 1)
          if [ -n "$APK" ]; then
            echo "path=$APK" >> "$GITHUB_OUTPUT"
            echo "found=true" >> "$GITHUB_OUTPUT"
            echo "Found APK: $APK ($(du -h "$APK" | cut -f1))"
          else
            echo "found=false" >> "$GITHUB_OUTPUT"
            echo "::error::No release APK found under build/app/outputs"
            exit 1
          fi

      - name: Upload APK artifact
        if: steps.apk.outputs.found == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: taksh-app-apk
          path: ${{ steps.apk.outputs.path }}
          retention-days: 14
          if-no-files-found: error

      - name: Summary
        if: steps.apk.outputs.found == 'true'
        run: |
          {
            echo "## Android APK built"
            echo ""
            echo "- Artifact name: \`taksh-app-apk\` (retained 14 days)"
            echo "- File: \`$(basename "${{ steps.apk.outputs.path }}")\`"
            echo "- Commit: \`${GITHUB_SHA::7}\`"
            echo ""
            echo "**Download:** Actions → this run → *Artifacts* section at the bottom of this page → \`taksh-app-apk\`."
            echo ""
            echo "> Release build signed with the **debug key** (no release keystore configured). Fine for testing, not for Play Store."
          } >> "$GITHUB_STEP_SUMMARY"

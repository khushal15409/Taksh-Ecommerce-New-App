<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 290" width="360" height="290">
  <defs>
    <linearGradient id="cartG" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3F8F5C"/>
      <stop offset="1" stop-color="#2D5A3D"/>
    </linearGradient>
    <linearGradient id="bagG" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFE3C2"/>
      <stop offset="1" stop-color="#F9B97A"/>
    </linearGradient>
    <linearGradient id="carrotG" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FF9A3D"/>
      <stop offset="1" stop-color="#EA580C"/>
    </linearGradient>
    <radialGradient id="tomG" cx="0.35" cy="0.3" r="0.8">
      <stop offset="0" stop-color="#FF7A6B"/>
      <stop offset="1" stop-color="#D93A2B"/>
    </radialGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.38"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- soft light disc -->
  <circle cx="180" cy="140" r="138" fill="url(#glow)"/>
  <circle cx="180" cy="140" r="112" fill="#FFFFFF" fill-opacity="0.16"/>
  <!-- ground shadow -->
  <ellipse cx="190" cy="262" rx="104" ry="10" fill="#000000" fill-opacity="0.14"/>

  <!-- speed lines -->
  <rect x="18" y="128" width="54" height="9" rx="4.5" fill="#FFFFFF" fill-opacity="0.9"/>
  <rect x="34" y="150" width="44" height="9" rx="4.5" fill="#FFFFFF" fill-opacity="0.7"/>
  <rect x="10" y="172" width="38" height="9" rx="4.5" fill="#FFFFFF" fill-opacity="0.5"/>

  <!-- paper bag (back) -->
  <path d="M232 92 L284 92 L290 170 L226 170 Z" fill="url(#bagG)"/>
  <path d="M244 92 Q258 66 272 92" fill="none" stroke="#E08A3C" stroke-width="5" stroke-linecap="round"/>
  <rect x="244" y="118" width="28" height="22" rx="5" fill="#FFFFFF" fill-opacity="0.85"/>
  <path d="M253 129 L258 134 L267 123" fill="none" stroke="#2F7A4B" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- milk carton -->
  <path d="M134 98 L172 98 L172 168 L134 168 Z" fill="#FFFFFF"/>
  <path d="M134 98 L153 80 L172 98 Z" fill="#E9F1EC"/>
  <rect x="134" y="118" width="38" height="26" fill="#2F7A4B"/>
  <circle cx="153" cy="131" r="7" fill="#FFFFFF"/>

  <!-- broccoli -->
  <rect x="199" y="112" width="12" height="40" rx="6" fill="#7DBE8E"/>
  <circle cx="190" cy="104" r="17" fill="#2F7A4B"/>
  <circle cx="212" cy="100" r="18" fill="#3F8F5C"/>
  <circle cx="201" cy="86" r="17" fill="#4C9A63"/>
  <circle cx="180" cy="116" r="12" fill="#2D5A3D"/>
  <circle cx="222" cy="114" r="12" fill="#2F7A4B"/>

  <!-- carrots -->
  <path d="M96 120 L136 150 L128 160 Z" fill="url(#carrotG)"/>
  <path d="M96 120 L88 108 M96 120 L84 118 M96 120 L92 106" stroke="#4C9A63" stroke-width="5" stroke-linecap="round"/>
  <path d="M108 112 L146 146 L137 156 Z" fill="#F97316"/>
  <path d="M108 112 L101 99 M108 112 L96 108 M108 112 L106 97" stroke="#2F7A4B" stroke-width="5" stroke-linecap="round"/>

  <!-- tomatoes & apple -->
  <circle cx="250" cy="156" r="17" fill="url(#tomG)"/>
  <path d="M243 142 Q250 150 257 142 Q250 146 243 142 Z" fill="#2F7A4B"/>
  <circle cx="118" cy="162" r="14" fill="url(#tomG)"/>
  <path d="M112 151 Q118 158 124 151 Q118 154 112 151 Z" fill="#2F7A4B"/>

  <!-- cart basket -->
  <path d="M96 148 L292 148 L270 222 L122 222 Z" fill="url(#cartG)"/>
  <path d="M96 148 L292 148 L288 160 L100 160 Z" fill="#FFFFFF" fill-opacity="0.22"/>
  <g stroke="#FFFFFF" stroke-opacity="0.35" stroke-width="3" stroke-linecap="round">
    <path d="M146 162 L152 220"/>
    <path d="M194 162 L194 220"/>
    <path d="M242 162 L236 220"/>
    <path d="M110 188 L282 188"/>
  </g>
  <!-- handle -->
  <path d="M44 74 L76 74 Q88 74 92 88 L106 148" fill="none" stroke="#FFFFFF" stroke-width="9" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- chassis -->
  <path d="M130 222 L142 240 L262 240" fill="none" stroke="#FFFFFF" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- wheels -->
  <circle cx="150" cy="254" r="13" fill="#16181F"/>
  <circle cx="150" cy="254" r="5" fill="#FFFFFF"/>
  <circle cx="250" cy="254" r="13" fill="#16181F"/>
  <circle cx="250" cy="254" r="5" fill="#FFFFFF"/>

  <!-- express bolt badge -->
  <circle cx="300" cy="62" r="30" fill="#FFFFFF"/>
  <circle cx="300" cy="62" r="25" fill="#F97316"/>
  <path d="M306 44 L290 66 L300 66 L294 82 L312 58 L302 58 Z" fill="#FFFFFF"/>

  <!-- leaves & sparkles -->
  <path d="M40 232 Q56 204 84 214 Q72 242 40 232 Z" fill="#6FB383"/>
  <path d="M40 232 Q60 222 84 214" fill="none" stroke="#2F7A4B" stroke-width="2"/>
  <path d="M318 214 Q336 190 352 204 Q344 232 318 214 Z" fill="#6FB383"/>
  <path d="M318 214 Q336 206 352 204" fill="none" stroke="#2F7A4B" stroke-width="2"/>
  <circle cx="60" cy="60" r="6" fill="#FFFFFF" fill-opacity="0.8"/>
  <circle cx="330" cy="130" r="5" fill="#FFFFFF" fill-opacity="0.7"/>
  <circle cx="24" cy="100" r="4" fill="#FFFFFF" fill-opacity="0.6"/>

name: taksh_e_commerce
description: "A production-ready Flutter food delivery application following Clean Architecture"
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.8.0 <4.0.0"
  flutter: ">=3.22.0"

dependencies:
  flutter:
    sdk: flutter

  # State Management
  flutter_bloc: ^8.1.3
  equatable: ^2.0.5

  # Dependency Injection
  get_it: ^7.6.4

  # Functional Programming
  dartz: ^0.10.1

  # Network
  dio: ^5.3.3
  connectivity_plus: ^5.0.1

  # Location & Permissions
  geolocator: ^12.0.0
  permission_handler: ^11.3.0
  google_maps_flutter: ^2.5.0
  geocoding: ^3.0.0

  # Routing
  go_router: ^12.1.0

  # Local Storage
  shared_preferences: ^2.2.2
  hive: ^2.2.3
  hive_flutter: ^1.1.0

  # Code Generation
  freezed_annotation: ^2.4.1
  json_annotation: ^4.9.0

  # Logging
  logger: ^2.0.2+1

  # UI/UX
  cached_network_image: ^3.3.0
  flutter_secure_storage: ^10.0.0
  talker_flutter: ^4.0.0
  talker: 4.0.0
  url_launcher: ^6.2.4
  flutter_svg: ^2.0.10+1
  google_fonts: ^6.1.0

  # Payment
  razorpay_flutter: ^1.3.7

  # Image Picker
  image_picker: ^1.0.7

  # File handling for downloads (invoices, etc.)
  path_provider: ^2.1.2
  open_filex: ^4.4.0

  # Environment Variables
  flutter_dotenv: ^5.1.0

  # Utilities
  uuid: ^4.5.2

  flutter_localizations:
    sdk: flutter
  intl: any

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

  # Code Generation
  build_runner: ^2.4.6
  freezed: ^2.4.5
  json_serializable: ^6.7.1
  hive_generator: ^2.0.1

  # Testing
  mockito: ^5.4.2
  bloc_test: ^9.1.5

flutter:
  uses-material-design: true
  generate: true

  assets:
    - .env
    - docs/splash_logo.jpeg
    - "docs/Image (7).jpg"
    - assets/images/
    - assets/images/diwali/
    - assets/images/onboarding/
    - assets/images/redesign/
    - assets/images/logo/
    # - assets/icons/

  # fonts:
  #   - family: Poppins
  #     fonts:
  #       - asset: assets/fonts/Poppins-Regular.ttf
  #       - asset: assets/fonts/Poppins-Bold.ttf
  #         weight: 700
